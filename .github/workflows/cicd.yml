name: CI/CD Pipeline - Build and Deploy to Kubernetes

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: 🏗️ Cloud CI - Build & Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax & Import Check
        run: |
          python -c "import app; print('App module loaded successfully!')"

      - name: Build Docker Container
        run: |
          docker build -t flask-app:latest .
          echo "Docker image built successfully in CI!"

  deploy-to-minikube:
    name: 🚀 Local CD - Deploy to Minikube
    needs: build-and-test
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build & Load Image into Minikube
        shell: powershell
        run: |
          $env:PATH = "C:\Users\Anurag\bin;C:\Users\Anurag\AppData\Local\Programs\DockerDesktop\resources\bin;$env:PATH"
          Write-Host "Building Docker image locally..."
          docker build -t flask-app:latest .
          Write-Host "Loading image into Minikube..."
          minikube image load flask-app:latest

      - name: Deploy to Kubernetes
        shell: powershell
        run: |
          $env:PATH = "C:\Users\Anurag\bin;C:\Users\Anurag\AppData\Local\Programs\DockerDesktop\resources\bin;$env:PATH"
          Write-Host "Applying Kubernetes manifests..."
          kubectl apply -f k8s/deployment.yaml
          Write-Host "Restarting deployment to pick up latest image..."
          kubectl rollout restart deployment/flask-app
          kubectl rollout status deployment/flask-app --timeout=60s

      - name: Verification
        shell: powershell
        run: |
          $env:PATH = "C:\Users\Anurag\bin;C:\Users\Anurag\AppData\Local\Programs\DockerDesktop\resources\bin;$env:PATH"
          Write-Host "Checking Deployment and Pod status..."
          kubectl get pods -l app=flask-app
          kubectl get svc flask-service
          Write-Host "CI/CD Pipeline deployment completed successfully!"
